<style>

</style></head><body>

 /* universe */

 const fly=pts(mob?120:260,(i,p)=>p.set([rnd(-20,20),rnd(.2,4),rnd(-20,20)],i*3),.12,0xb8ffd8,gE);G.add(fly);const RN=mob?250:500,rain=pts(RN,(i,p)=>p.set([rnd(-22,22),rnd(0,16),rnd(-22,22)],i*3),.09,0x9fd8ff,gW);G.add(rain);for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(rnd(5,9),rnd(9,17),5),new THREE.MeshStandardMaterial({color:0x06201a,flatShading:true,roughness:1})),a=i*.9+.3;m.position.set(Math.cos(a)*34,m.geometry.parameters.height/2-1,Math.sin(a)*34);G.add(m)}
 const PN=mob?120:240,pet=pts(PN,(i,p)=>p.set([rnd(-18,18),rnd(0,12),rnd(-18,18)],i*3),.3,0xff8fb8,gP);G.add(pet);
 const bf=[0x40ffc0,0xffd070,0x70d0ff].flatMap((c,j)=>Array.from({length:4},(_,i)=>{const g=new THREE.Group(),wg=new THREE.CircleGeometry(.4,12);wg.scale(1,.75,1);wg.translate(.4,0,0);wg.rotateX(-Math.PI/2);
