<style>

  [110,164.8,220,261.6,329.6,392].forEach((fr,i)=>{const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type=i%2?'triangle':'sine';o.frequency.value=fr;o.detune.value=(i-3)*4;g.gain.value=.05;l.frequency.value=.05+i*.03;lg.gain.value=.03;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(mg);o.start();l.start()})}
 ac.resume();mg.gain.cancelScheduledValues(ac.currentTime);mg.gain.setValueAtTime(mg.gain.value,ac.currentTime);mg.gain.linearRampToValueAtTime(on?.6:0,ac.currentTime+1.8)}catch(e){sb.hidden=true}};
/* البداية */
